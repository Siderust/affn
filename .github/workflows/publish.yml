name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]*"
  # Retry an existing immutable release tag using the latest workflow from main.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to retry (for example, v0.12.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual retries build the original tag, not whatever is now on main.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check release versions in the Cargo sparse index
        id: registry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must run the workflow from main"
              exit 1
            fi
          elif [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Unsupported release ref: $GITHUB_REF"
            exit 1
          fi

          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version() {
            jq -er --arg name "$1" '
              [.packages[] | select(.name == $name) | .version] |
              if length == 1 then .[0] else error("missing or duplicate package: " + $name) end
            ' <<< "$metadata"
          }

          affn_version="$(package_version affn)"
          derive_version="$(package_version affn-derive)"
          if [[ "$RELEASE_TAG" != "v$affn_version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match affn $affn_version"
            exit 1
          fi

          # crates.io API can reject curl requests with HTTP 403. Cargo's
          # official sparse index is the source of truth for published versions.
          # Both workspace crate names have >=4 chars: the index path is
          # <first 2>/<next 2>/<lowercase name>.
          published() {
            local crate="$1" version="$2" index_path status found index_file
            index_path="${crate:0:2}/${crate:2:2}/$crate"
            index_file="$(mktemp)"
            if ! status="$(curl --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 --output "$index_file" --write-out '%{http_code}' --user-agent 'Siderust-affn-release/1.0 (+https://github.com/Siderust/affn)' "https://index.crates.io/$index_path")"; then
              rm -f "$index_file"
              echo "::error::Unable to query Cargo index for $crate" >&2
              return 1
            fi
            case "$status" in
              200)
                if ! found="$(jq -s -r --arg crate "$crate" --arg version "$version" 'if length > 0 then any(.[]; .name == $crate and .vers == $version) else error("empty index file") end' "$index_file")"; then
                  rm -f "$index_file"
                  echo "::error::Invalid Cargo index for $crate" >&2
                  return 1
                fi
                ;;
              404) found=false ;;
              *)
                rm -f "$index_file"
                echo "::error::Cargo sparse index returned HTTP $status for $crate@$version" >&2
                return 1
                ;;
            esac
            rm -f "$index_file"
            printf '%s\n' "$found"
          }

          derive_published="$(published affn-derive "$derive_version")"
          affn_published="$(published affn "$affn_version")"
          echo "derive_published=$derive_published" >> "$GITHUB_OUTPUT"
          echo "affn_published=$affn_published" >> "$GITHUB_OUTPUT"
          echo "affn-derive@$derive_version already published: $derive_published"
          echo "affn@$affn_version already published: $affn_published"

      # Publish in dependency order, skipping versions that already exist.
      - name: Publish affn-derive
        if: steps.registry.outputs.derive_published == 'false'
        run: cargo publish -p affn-derive --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index affn-derive
        if: steps.registry.outputs.derive_published == 'false' && steps.registry.outputs.affn_published == 'false'
        run: sleep 30

      - name: Publish affn
        if: steps.registry.outputs.affn_published == 'false'
        run: cargo publish -p affn --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
